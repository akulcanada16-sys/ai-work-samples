name: Ephemeral IRIS 2026.2 integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'outreach/iris-task-timeline/**'
      - '.github/workflows/iris-task-timeline.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Docker Hub's 2026.2 linux-amd64 image digest, checked 2026-09-15.
      IRIS_IMAGE: intersystems/iris-community@sha256:d4331089a4d19aafa867c26b343eb2b8486cf112ef1522132761e6327691377e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Run offline contract checks
        run: node --test outreach/iris-task-timeline/test/*.test.js
      - name: Generate disposable IRIS test credentials
        run: |
          password="Tt$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf 'IRIS_TEST_USER=%s\n' 'TaskTimelineCI' >> "$GITHUB_ENV"
          printf 'IRIS_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
      - name: Start pinned official IRIS Community Edition
        run: docker run -d --name iris -p 127.0.0.1:52773:52773 "$IRIS_IMAGE"
      - name: Wait for IRIS web server
        run: for i in {1..60}; do curl --fail --silent --output /dev/null http://localhost:52773/csp/sys/UtilHome.csp && exit 0; sleep 5; done; exit 1
      - name: Configure a dedicated CSP static application and diagnose its page
        run: |
          # /csp/task-timeline is configured below; its physical path is explicit.
          docker exec iris mkdir -p /usr/irissys/csp/task-timeline
          docker cp outreach/iris-task-timeline/. iris:/usr/irissys/csp/task-timeline/
          docker exec iris sh /usr/irissys/csp/task-timeline/integration/seed-safe-fixtures.sh
          terminal_output="$(mktemp)"
          set +e
          docker exec -e IRIS_TEST_PASSWORD="$IRIS_TEST_PASSWORD" -i iris iris terminal IRIS < outreach/iris-task-timeline/integration/configure-static-csp.iris > "$terminal_output" 2>&1
          terminal_status=$?
          set -e
          if [ "$terminal_status" -ne 0 ]; then
            printf 'IRIS terminal invocation exited %s. Limited diagnostics follow.\n' "$terminal_status"
            sed -n '1,80p' "$terminal_output"
            docker inspect --format 'Container state: status={{.State.Status}} running={{.State.Running}} exitCode={{.State.ExitCode}} startedAt={{.State.StartedAt}}' iris
            docker exec iris iris qlist IRIS || true
            exit "$terminal_status"
          fi
          if grep -q '<SYNTAX>' "$terminal_output"; then
            printf '%s\n' 'IRIS terminal reported an ObjectScript syntax error:'
            sed -n '1,160p' "$terminal_output"
            exit 1
          fi
          if [ "$(grep -Fxc 'IRIS_CONFIG_OK' "$terminal_output")" -ne 1 ]; then
            printf '%s\n' 'IRIS configuration did not emit exactly one success sentinel:'
            sed -n '1,160p' "$terminal_output"
            exit 1
          fi
          cat "$terminal_output"
          docker exec iris sh -c 'printf "Mapped directory: /usr/irissys/csp/task-timeline\nExpected: directory must be searchable/readable and static files readable by the IRIS web-server process.\nActual directory and file permissions:\n"; ls -ld /usr/irissys/csp/task-timeline; stat -c "%A %U:%G %n" /usr/irissys/csp/task-timeline/index.html /usr/irissys/csp/task-timeline/src/app.js'
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          metadata_file="$(mktemp)"
          set +e
          curl --silent --show-error --output "$response_file" --dump-header "$headers_file" --write-out '%{http_code}\n%{content_type}\n' http://localhost:52773/csp/task-timeline/index.html > "$metadata_file"
          curl_status=$?
          set -e
          http_status="$(sed -n '1p' "$metadata_file")"
          content_type="$(sed -n '2p' "$metadata_file")"
          redirect_path="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { value=$0; sub(/^[^:]*:[[:space:]]*/, "", value); sub(/\?.*/, "", value); print value; exit }' "$headers_file")"
          printf 'Static page curl exit=%s HTTP status=%s content-type=%s\n' "$curl_status" "$http_status" "$content_type"
          if [ -n "$redirect_path" ]; then printf 'Redirect path (query removed)=%s\n' "$redirect_path"; fi
          printf '%s\n' 'Static page body, first 1500 bytes:'
          head -c 1500 "$response_file"
          printf '\n'
          test "$curl_status" -eq 0
          test "$http_status" = 200
          case "$content_type" in text/html*) ;; *) exit 1;; esac
          grep -F "Task Failure Timeline" "$response_file"
      - name: Verify documented response wrappers and field shapes
        run: |
          print_shape() {
            local body="$1"
            if [ ! -s "$body" ] || ! jq -e . "$body" >/dev/null 2>&1; then
              printf '%s\n' 'JSON parse valid=false'
              return
            fi
            printf '%s\n' 'JSON parse valid=true'
            jq -c 'def type_tree: if type == "object" then with_entries(.value |= type) else type end; if type == "object" then {root: type_tree, result: (if has("result") then (.result | type_tree) else "absent" end)} else {root: type, result: "absent"} end' "$body"
          }
          print_safe_login_error() {
            local body="$1"
            if jq -e . "$body" >/dev/null 2>&1; then
              jq -c 'def field($name): .[$name] as $value | if ($value | type) == "string" or ($value | type) == "number" or ($value | type) == "boolean" then $value else null end; {status: field("status"), code: field("code"), error: field("error"), message: field("message"), detail: field("detail")} | with_entries(select(.value != null))' "$body"
            else
              printf '%s\n' 'API login failure body was not JSON (body suppressed).'
            fi
          }
          login_body="$(mktemp)"
          login_headers="$(mktemp)"
          login_meta="$(mktemp)"
          curl --silent --show-error --output "$login_body" --dump-header "$login_headers" --write-out '%{http_code}\n%{content_type}\n' -X POST http://localhost:52773/api/admin/login -H 'Content-Type: application/json' --data "{\"user\":\"$IRIS_TEST_USER\",\"password\":\"$IRIS_TEST_PASSWORD\"}" > "$login_meta"
          login_status="$(sed -n '1p' "$login_meta")"
          login_content_type="$(sed -n '2p' "$login_meta")"
          login_redirect_path="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { value=$0; sub(/^[^:]*:[[:space:]]*/, "", value); sub(/\?.*/, "", value); print value; exit }' "$login_headers")"
          login_bytes="$(wc -c < "$login_body")"
          printf 'API login HTTP status=%s content-type=%s bytes=%s\n' "$login_status" "$login_content_type" "$login_bytes"
          if [ -n "$login_redirect_path" ]; then printf 'API login redirect path (query removed)=%s\n' "$login_redirect_path"; fi
          if [ "$login_status" != 200 ]; then
            print_safe_login_error "$login_body"
            exit 1
          fi
          print_shape "$login_body"
          if ! token="$(jq -er '[.result?.access_token, .access_token] | map(select(type == "string" and length > 0)) | .[0]' "$login_body" 2>/dev/null)"; then
            printf '%s\n' 'API login response did not contain a usable root or result.access_token; values suppressed.'
            print_shape "$login_body"
            exit 1
          fi
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"
          verify_read() {
            local path="$1"
            local body headers meta status content_type bytes wrapper rows redirect_path
            body="$(mktemp)"
            headers="$(mktemp)"
            meta="$(mktemp)"
            curl --silent --show-error --output "$body" --dump-header "$headers" --write-out '%{http_code}\n%{content_type}\n' -H "$auth" "http://localhost:52773/api/admin/$path" > "$meta"
            status="$(sed -n '1p' "$meta")"
            content_type="$(sed -n '2p' "$meta")"
            bytes="$(wc -c < "$body")"
            redirect_path="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { value=$0; sub(/^[^:]*:[[:space:]]*/, "", value); sub(/\?.*/, "", value); print value; exit }' "$headers")"
            printf 'API GET path=%s status=%s content-type=%s bytes=%s\n' "$path" "$status" "$content_type" "$bytes"
            if [ -n "$redirect_path" ]; then printf 'API GET redirect path (query removed)=%s\n' "$redirect_path"; fi
            if [ "$status" != 200 ] || ! jq -e . "$body" >/dev/null 2>&1; then
              print_shape "$body"
              exit 1
            fi
            wrapper="$(jq -er '.result | type' "$body")"
            if [ "$wrapper" != array ]; then
              printf 'API GET wrapper resultType=%s expected=array\n' "$wrapper"
              print_shape "$body"
              exit 1
            fi
            rows="$(jq -er '.result | length' "$body")"
            printf 'API GET wrapper=result array rows=%s\n' "$rows"
          }
          verify_read 'v2/tasks'
          verify_read 'v2/task/history?maxRows=100'
          verify_read 'v2/task/upcoming?hoursOffset=168&maxRows=100'
      - name: Browser smoke test against the ephemeral IRIS page
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node outreach/iris-task-timeline/integration/browser-smoke.mjs
      - name: Tear down ephemeral database
        if: always()
        run: docker rm -f iris
