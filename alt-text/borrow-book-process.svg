<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc"><title id="title">Three steps to borrow a library book</title><desc id="desc">Choose a book, check it out, then take it home.</desc><rect width="720" height="240" fill="#f8fbfc"/><g font-family="Arial" text-anchor="middle" fill="#123047"><path d="M210 120h90M420 120h90" stroke="#238a9a" stroke-width="6"/><path d="M288 110l12 10-12 10M498 110l12 10-12 10" fill="none" stroke="#238a9a" stroke-width="6"/><g><circle cx="140" cy="120" r="52" fill="#d5eef1"/><text x="140" y="127" font-size="28">1</text><text x="140" y="205" font-size="18">Choose a book</text></g><g><circle cx="360" cy="120" r="52" fill="#d5eef1"/><text x="360" y="205" font-size="18">Check it out</text><text x="360" y="127" font-size="28">2</text></g><g><circle cx="580" cy="120" r="52" fill="#d5eef1"/><text x="580" y="127" font-size="28">3</text><text x="580" y="205" font-size="18">Take it home</text></g></g></svg>
