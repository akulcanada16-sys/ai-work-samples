<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">DialGuard deployed architecture</title><desc id="desc">Browser sends an access-code-protected image to an AWS Lambda function URL. Lambda runs OpenCV 5 quality, polar sampling, verification and decision tools. Derived evidence goes to private S3 and operational metadata to CloudWatch. AWS deployment is prepared but not verified.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#52715d"/></marker></defs>
<rect width="960" height="570" fill="#f4f5ef"/><g font-family="sans-serif" fill="#233d30"><text x="35" y="40" font-size="24" font-weight="700">DialGuard · deployment architecture</text><text x="35" y="65" font-size="13">Prepared AWS path; local workload and handler contract tested. AWS deployment pending.</text>
<rect x="30" y="95" width="210" height="125" rx="10" fill="#fff" stroke="#b8cab3"/><text x="50" y="125" font-size="17" font-weight="700">Browser</text><text x="50" y="150" font-size="13">Photo + calibration</text><text x="50" y="175" font-size="13">Demo access code</text><text x="50" y="200" font-size="13">Annotated result + trace</text>
<rect x="310" y="95" width="340" height="340" rx="10" fill="#e4efdf" stroke="#75936b"/><text x="330" y="126" font-size="17" font-weight="700">AWS Lambda · OpenCV 5</text><text x="330" y="151" font-size="13">Function URL → token + size validation</text>
<g font-size="13"><rect x="330" y="170" width="300" height="42" rx="6" fill="#fff"/><text x="346" y="196">Quality: brightness + Laplacian</text><rect x="330" y="230" width="300" height="42" rx="6" fill="#fff"/><text x="346" y="256">Hough baseline + polar needle scan</text><rect x="330" y="290" width="300" height="42" rx="6" fill="#fff"/><text x="346" y="316">Selected-angle contrast verification</text><rect x="330" y="350" width="300" height="62" rx="6" fill="#fff"/><text x="346" y="376">Bounded decision controller</text><text x="346" y="398">Read · request retake · human review</text></g>
<rect x="720" y="95" width="210" height="125" rx="10" fill="#fff" stroke="#b8cab3"/><text x="740" y="125" font-size="17" font-weight="700">Private S3</text><text x="740" y="151" font-size="13">Reading + trace + input hash</text><text x="740" y="177" font-size="13">No raw photo retained</text><text x="740" y="203" font-size="13">7-day lifecycle</text>
<rect x="720" y="290" width="210" height="105" rx="10" fill="#fff" stroke="#b8cab3"/><text x="740" y="320" font-size="17" font-weight="700">CloudWatch</text><text x="740" y="346" font-size="13">Status + duration + run ID</text><text x="740" y="372" font-size="13">7-day logs</text>
<text x="35" y="488" font-size="14">Local alternative: the same analysis contract runs in a Python HTTP server; no AWS is simulated as deployed.</text><text x="35" y="518" font-size="13">Human control: calibration and review threshold are explicit. No actuator, broker, or machinery control.</text>
</g><g stroke="#52715d" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M240 153H304"/><path d="M310 188H246"/><path d="M650 156H714"/><path d="M650 335H714"/><path d="M480 212V225"/><path d="M480 272V285"/><path d="M480 332V345"/></g></svg>
