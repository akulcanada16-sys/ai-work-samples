# Template only. Publish this as .github/workflows/epub-formatting.yml after
# mapping this folder to the repository root as epub-formatting/.
name: Validate EPUB formatting sample

on:
  workflow_dispatch:
  push:
    paths:
      - "epub-formatting/**"
      - ".github/workflows/epub-formatting.yml"
  pull_request:
    paths:
      - "epub-formatting/**"
      - ".github/workflows/epub-formatting.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EPUBCHECK_URL: https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
      EPUBCHECK_SHA256: 6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and structurally inspect the EPUB
        run: |
          cp epub-formatting/dist/an-index-of-small-things.epub "$RUNNER_TEMP/published.epub"
          python3 epub-formatting/build_epub.py
          python3 epub-formatting/verify_epub.py
          cmp "$RUNNER_TEMP/published.epub" epub-formatting/dist/an-index-of-small-things.epub
          sha256sum epub-formatting/dist/an-index-of-small-things.epub
      - name: Download and verify official EPUBCheck 5.3.0
        run: |
          curl --fail --location --silent --show-error "$EPUBCHECK_URL" --output "$RUNNER_TEMP/epubcheck-5.3.0.zip"
          echo "$EPUBCHECK_SHA256  $RUNNER_TEMP/epubcheck-5.3.0.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/epubcheck-5.3.0.zip" -d "$RUNNER_TEMP/epubcheck"
      - name: Validate the packaged EPUB with EPUBCheck
        run: java -jar "$RUNNER_TEMP/epubcheck/epubcheck-5.3.0/epubcheck.jar" --failonwarnings epub-formatting/dist/an-index-of-small-things.epub
